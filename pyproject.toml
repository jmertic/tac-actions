[tool.poetry]
name = "lfx-tac-actions"
version = "20260908"
description = "GitHub Action to sync data from LFX to various locations"
authors = ["John Mertic <jmertic@linuxfoundation.org>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0.2"
requests = "^2.33.0"
pathvalidate = "^3.3.1"
python-frontmatter = "^1.3.0"
cairosvg = "^2.9.0"

[tool.poetry.group.test.dependencies]
coverage = "^7.16.0"
responses = ">=0.26.3,<0.27.0"

[tool.poetry.scripts]
updateprojects = "lfx_tac_actions.updateprojects:main"
updateclomonitor = "lfx_tac_actions.updateclomonitor:main"
updatetacmembers = "lfx_tac_actions.updatetacmembers:main"
updatetacagendaitems = "lfx_tac_actions.updatetacagendaitems:main"
updatedecks = "lfx_tac_actions.updatedecks:main"
updatecharters = "lfx_tac_actions.updatecharters:main"
updateartwork = "lfx_tac_actions.updateartwork:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
